name: GPU photoreal renders (free Kaggle GPU)
on:
  workflow_dispatch:
    inputs:
      kaggle_username:
        description: "Kaggle username"
        required: true
permissions:
  contents: write
jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KUSER: ${{ inputs.kaggle_username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U kaggle
      - name: Prepare and push the kernel
        run: |
          mkdir kernel && cp gpu/kaggle_render.py kernel/script.py
          cat > kernel/kernel-metadata.json <<META
          {"id": "$KUSER/zahma-render", "title": "zahma-render", "code_file": "script.py",
           "language": "python", "kernel_type": "script", "is_private": "true",
           "enable_gpu": "true", "enable_internet": "true", "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          META
          kaggle kernels push -p kernel
      - name: Wait for the GPU run
        run: |
          for i in $(seq 1 200); do
            S=$(kaggle kernels status "$KUSER/zahma-render" 2>&1 || true); echo "$i: $S"
            case "$S" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
            sleep 60
          done
      - name: Download and commit the renders
        run: |
          kaggle kernels output "$KUSER/zahma-render" -p out || true
          mkdir -p renders && cp out/*.jpg out/*.mp4 out/run.log renders/ 2>/dev/null || true
          git config user.name "zahma-bot"; git config user.email "zahma-bot@users.noreply.github.com"
          git add renders && git commit -m "Photoreal renders from the free Kaggle GPU" || echo "nothing to commit"
          git pull --rebase origin main && git push origin HEAD:main
