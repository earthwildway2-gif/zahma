name: Build voice and map data
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python tools/extract_lines.py
      - run: python tools/make_voice.py --engine edge
      - run: python tools/build_voice.py
      - name: Commit results
        run: |
          git config user.name "zahma-bot"
          git config user.email "zahma-bot@users.noreply.github.com"
          git add -A voice index.html
          git commit -m "Add Egyptian AI voice clips" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
  osm:
    needs: voice
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real street and building data (OpenStreetMap)
        run: |
          python tools/osm_fetch.py imbaba 30.0705 31.2015 30.0815 31.2125
          sleep 20
          python tools/osm_fetch.py downtown 30.0390 31.2300 30.0500 31.2410
          sleep 20
          python tools/osm_fetch.py haram 29.9945 31.1630 30.0055 31.1740
      - name: Commit results
        run: |
          git config user.name "zahma-bot"
          git config user.email "zahma-bot@users.noreply.github.com"
          git add -A data
          git commit -m "Add OpenStreetMap data for the three districts" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
