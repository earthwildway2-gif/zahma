<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14110f">
<title>زحمة 3D — توصيلة الفجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#14110f; --panel:rgba(24,19,16,.94); --line:#4a3d31;
  --fg:#f6ecd9; --dim:#b9ab93; --accent:#e8a838; --danger:#e2553f; --ok:#5fbf7a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
body{height:100%;position:relative;font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.ingame{display:none}
body.playing .ingame{display:flex}
body:not(.playing) .ingame{display:none!important}

/* HUD */
#hud{position:absolute;top:8px;left:0;right:0;padding:0 12px;pointer-events:none;text-align:center}
#obj{display:inline-block;max-width:92%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:6px 14px;font-weight:700;font-size:15px}
#row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:700;font-size:15px;
  text-shadow:0 1px 3px #000}
#row span{background:rgba(20,17,15,.72);border-radius:8px;padding:3px 10px}
#dist{margin-top:6px;font-size:13px;color:var(--dim);text-shadow:0 1px 3px #000;min-height:18px}
#dist.bad{color:var(--danger);font-weight:700}
#mini{position:absolute;left:10px;top:124px;width:104px;height:78px;border:2px solid var(--line);
  border-radius:8px;opacity:.9;pointer-events:none}
#arrow{position:absolute;top:96px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;
  background:var(--panel);border:2px solid var(--accent);align-items:center;justify-content:center;pointer-events:none}
#arrowi{font-size:20px;color:var(--accent);line-height:1}
#tgs{position:absolute;right:10px;top:124px;gap:8px;direction:ltr;flex-direction:column}
.tg{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);
  background:rgba(20,17,15,.7);color:var(--fg);font-size:19px;display:flex;align-items:center;justify-content:center;padding:0}
.tg.off{opacity:.45}

/* Toast */
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);max-width:86%;
  background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px 18px;
  font-weight:900;font-size:19px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

/* Controls */
#ctl{position:absolute;left:0;right:0;bottom:14px;padding:0 14px;align-items:flex-end;
  justify-content:space-between;direction:ltr;pointer-events:none}
#ctl .grp{display:flex;gap:12px;align-items:flex-end}
.b{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:2px solid rgba(246,236,217,.35);
  background:rgba(20,17,15,.55);color:var(--fg);font:900 24px Cairo,Arial,sans-serif;display:flex;
  flex-direction:column;align-items:center;justify-content:center;touch-action:none;padding:0}
.b small{font-size:11px;font-weight:700;color:var(--dim);margin-top:-2px}
.b.big{width:86px;height:86px;background:rgba(232,168,56,.45);border-color:var(--accent)}
.b.on{background:rgba(232,168,56,.85);color:#1a1207}
#bH{position:absolute;right:14px;bottom:118px;width:58px;height:58px;font-size:22px}
body.dlg #ctl,body.dlg #bH,body.dlg #arrow{display:none!important}

/* Dialogue */
#dlg{position:absolute;left:10px;right:10px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-top:4px solid var(--accent);border-radius:14px;padding:12px 16px 14px;max-width:640px;margin:0 auto}
#who{font-weight:900;color:var(--accent);font-size:16px;margin-bottom:4px}
#txt{font-size:18px;line-height:1.7;font-weight:500}
#hint{margin-top:8px;font-size:13px;color:var(--dim);text-align:left;direction:ltr}
#opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{font:700 16px Cairo,Arial,sans-serif;color:var(--fg);background:#2a221b;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;text-align:right}
.opt:active{background:#3b2f24}
.opt:disabled{opacity:.45}

/* Title / end screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;background:
  linear-gradient(180deg,rgba(20,17,15,.55),rgba(20,17,15,.96) 70%),
  repeating-linear-gradient(90deg,#1d1814 0 46px,#241d17 46px 92px)}
.screen h1{font-size:64px;font-weight:900;margin:0;color:var(--accent);line-height:1.1}
.screen h2{font-size:30px;font-weight:900;margin:0 0 6px}
.screen p{max-width:420px;line-height:1.8;color:var(--dim);font-size:16px;margin:10px 0}
.screen .sub{font-size:19px;color:var(--fg);font-weight:700;margin:6px 0 4px}
.go{margin-top:18px;font:900 22px Cairo,Arial,sans-serif;background:var(--accent);color:#1a1207;border:0;
  border-radius:14px;padding:13px 40px}
.go:active{transform:scale(.97)}
#stats{margin-top:8px;color:var(--fg);font-weight:700;line-height:1.9}
#nogl a{color:var(--accent)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="obj"></div>
  <div id="row"><span id="timer">03:20</span><span id="zone">إمبابة</span><span id="money">400 ج</span></div>
  <div id="dist"></div>
</div>
<div id="arrow" class="ingame"><div id="arrowi">▲</div></div>
<canvas id="mini" width="208" height="156" class="hidden"></canvas>
<div id="tgs" class="ingame">
  <button class="tg" id="tSound" aria-label="الصوت">🔊</button>
  <button class="tg" id="tMusic" aria-label="الموسيقى">🎵</button>
  <button class="tg" id="tVoice" aria-label="الأصوات البشرية">🗣</button>
</div>
<div id="toast"></div>

<div id="ctl" class="ingame">
  <div class="grp">
    <button class="b" id="bL" aria-label="يسار">◀</button>
    <button class="b" id="bR" aria-label="يمين">▶</button>
  </div>
  <div class="grp">
    <button class="b" id="bB" aria-label="فرامل">■<small>فرامل</small></button>
    <button class="b big" id="bG" aria-label="بنزين">▲<small>بنزين</small></button>
  </div>
</div>
<button class="b ingame" id="bH" aria-label="كلاكس">📢</button>

<div id="dlg" class="hidden">
  <div id="who"></div>
  <div id="txt"></div>
  <div id="opts"></div>
  <div id="hint">اضغط للمتابعة</div>
</div>

<div id="title" class="screen">
  <h1>زحمة</h1>
  <div class="sub">3D — الفصل الأول: توصيلة الفجر</div>
  <p>إنت سيد، سواق توكتوك من إمبابة، وعليك دين 20 ألف للمعلم حمودة. الليلة دي في توصيلة واحدة ممكن تمسح الدين... أو تخلّيه أكبر.</p>
  <p>افتح الصوت. في موسيقى ومؤثرات وكلاكس، والحوارات بتتقري بصوت عربي لو جهازك فيه صوت عربي.</p>
  <button class="go" id="start">ابدأ</button>
  <p id="nogl" class="hidden"></p>
</div>

<div id="end" class="screen hidden">
  <h2 id="endT"></h2>
  <p id="endP"></p>
  <div id="stats"></div>
  <button class="go" id="again">العب تاني</button>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#game');
const mini = $('#mini'), mctx = mini.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

const FONT = 'Cairo,Tahoma,"Segoe UI",Arial,sans-serif';

/* ---------- World data (2D logic space; 1 unit = 0.1 m in the 3D scene) ---------- */

const ZONES = [
  { name: 'إمبابة', tints: ['#8f5b42', '#a4664a', '#7d5340', '#b07a52'], plaza: '#3f5a3a', mini: '#8f5b42', floors: [4, 7],
    signs: ['كشري الحاج علي', 'صيدلية الشفاء', 'سوبر ماركت السلام', 'مكوجي', 'عصير قصب', 'فول وطعمية', 'كوافير حريمي', 'محل موبايلات'],
    signCols: ['#1f6f5c', '#a63a2f', '#2f5d9e', '#7a4b8f'] },
  { name: 'وسط البلد', tints: ['#b9a88c', '#c7b699', '#a99a82', '#cbb48a'], plaza: '#4a6146', mini: '#b9a88c', floors: [5, 8],
    signs: ['كافيه النيل', 'مكتبة وسط البلد', 'مطعم الجمهورية', 'محل أحذية', 'فندق النخيل', 'حلواني الأمير', 'بازار التحرير'],
    signCols: ['#2b4a3e', '#6b2d2d', '#243f66', '#5a4a1f'] },
  { name: 'الهرم', tints: ['#c9ab72', '#d8bd85', '#b99a5f', '#a98a52'], plaza: '#8a7a52', mini: '#c9ab72', floors: [3, 6],
    signs: ['كباريه القمر', 'مشويات الهرم', 'صالة ألعاب', 'كازينو النيل', 'مول الهرم', 'كافيه الصحرا'],
    signCols: ['#b02a6b', '#1a7f8f', '#8a2be2', '#c8541b'] }

const blocks = [], grid = [];
for (let i = 0; i < COLS; i++) {
  grid[i] = [];
  for (let j = 0; j < ROWS; j++) {
    const z = zoneOfBlock(i), Z = ZONES[z];
    const x = i * CELL + ROAD / 2, y = j * CELL + ROAD / 2, w = CELL - ROAD, h = CELL - ROAD;
    const plaza = rnd() < 0.12;
    const b = { i, j, x, y, w, h, z, plaza, tint: pick(Z.tints), sign: null, trees: [], floors: 0,
                solid: { x: x + 10, y: y + 10, w: w - 20, h: h - 20 } };
    if (plaza) { for (let k = 0; k < 7; k++) b.trees.push({ x: x + 40 + rnd() * (w - 80), y: y + 40 + rnd() * (h - 80), r: 14 + rnd() * 12 }); }
    else {
      b.floors = Z.floors[0] + Math.floor(rnd() * (Z.floors[1] - Z.floors[0] + 1));
      if (rnd() < 0.08) b.floors += 3;
      if (rnd() < 0.55) b.sign = { t: pick(Z.signs), c: pick(Z.signCols), side: Math.floor(rnd() * 4) };
    }
    grid[i][j] = b; blocks.push(b);
  }
}

const TARGETS = [
  { x: 4 * CELL, y: 1 * CELL, label: 'ورشة الأسطى فتحي' },
  { x: 6 * CELL, y: 5 * CELL, label: 'كافيه رمسيس' },
  { x: 11 * CELL, y: 8 * CELL, label: 'الهرم — التسليم' }
];
const START = { x: 1 * CELL, y: 1 * CELL };
const CHECKPOINT_X = 9 * CELL + 20;

/* ---------- State ---------- */
const P = { x: 0, y: 0, a: 0, v: 0, rad: 16, maxV: 130, level: 0 };
const G = { state: 'title', t: TOTAL_TIME, money: 400, stage: 0, hasBag: false, checkpointDone: false,
            heat: false, cop: null, barrier: null, trail: [], choice: 'عدّيت من غير مشاكل', shake: 0, zone: -1 };
P.x = START.x; P.y = START.y;
const keys = { up: false, down: false, left: false, right: false };
const touch = { up: false, down: false, left: false, right: false };
const npcs = [], smoke = [];
let now = 0, hudT = 0, miniT = 0, smokeT = 0, trailLast = { x: 0, y: 0 };

const NPC_TYPES = [
  { len: 54, wid: 28, body: '#1b1b1b', roof: '#e8e8e8' },
  { len: 70, wid: 32, body: '#e9edf0', roof: '#3d6fb5' },
  { len: 52, wid: 28, body: '#b23a3a', roof: '#3a2a2a' },
  { len: 52, wid: 28, body: '#3a6db2', roof: '#26303a' },
  { len: 52, wid: 28, body: '#8a8f94', roof: '#2a2a2a' }
];
function syncNpc(n) {
  if (n.horiz) { n.x = n.pos; n.y = n.line + n.off; n.a = n.dir === 1 ? 0 : Math.PI; }
  else { n.x = n.line + n.off; n.y = n.pos; n.a = n.dir === 1 ? Math.PI / 2 : -Math.PI / 2; }
}

/* ======================================================================
   3D scene
   ====================================================================== */
let renderer = null, scene = null, camera = null, hemi = null, baseFov = 62;
let skyCanvas = null, skyTex = null, stars = null, moon = null, sunS = null, skyT = 0;
let playerG = null, bagM = null, copG = null, barrierG = null, copLights = null, barrierLights = null;
let markerGs = [], smokeSprites = [];
const camState = { yaw: 0, init: false };
const lamCache = {}, geoCache = {};
const lam = c => lamCache[c] || (lamCache[c] = new THREE.MeshLambertMaterial({ color: c }));
const bas = c => new THREE.MeshBasicMaterial({ color: c });
const boxGeo = (w, h, d) => { const k = w + '_' + h + '_' + d; return geoCache[k] || (geoCache[k] = new THREE.BoxGeometry(w, h, d)); };
function mesh(w, h, d, mat, x, y, z) { const m = new THREE.Mesh(boxGeo(w, h, d), mat); m.position.set(x, y, z); return m; }

function makeCar(len, wid, body, roof) {           // scene units; forward = +X
  const g = new THREE.Group(), L = len * SC, Wd = wid * SC;
  g.add(mesh(L, 1.0, Wd, lam(body), 0, 0.95, 0));
  g.add(mesh(L * 0.5, 0.95, Wd * 0.92, lam(roof), -L * 0.06, 1.95, 0));
  g.add(mesh(L * 0.02, 0.5, Wd * 0.8, bas('#9fc9ee'), L * 0.2, 1.95, 0));
  for (const sx of [-0.32, 0.32]) for (const sz of [-1, 1]) g.add(mesh(0.9, 0.9, 0.35, lam('#161616'), L * sx, 0.45, sz * (Wd / 2)));
  g.add(mesh(0.1, 0.35, 0.5, bas('#fff2b8'), L / 2, 1.0, Wd * 0.3)); g.add(mesh(0.1, 0.35, 0.5, bas('#fff2b8'), L / 2, 1.0, -Wd * 0.3));
  g.add(mesh(0.1, 0.3, 0.5, bas('#d02020'), -L / 2, 1.0, Wd * 0.3)); g.add(mesh(0.1, 0.3, 0.5, bas('#d02020'), -L / 2, 1.0, -Wd * 0.3));
  return g;
}
function makeCop() {
  const g = makeCar(56, 30, '#f2f2f2', '#2452a8');
  const r = new THREE.MeshBasicMaterial({ color: '#ff3b30' }), b = new THREE.MeshBasicMaterial({ color: '#2d6cff' });
  g.add(mesh(0.6, 0.35, 0.9, r, -0.3, 2.6, 0.55)); g.add(mesh(0.6, 0.35, 0.9, b, -0.3, 2.6, -0.55));
  g.userData.lights = [r, b];
  return g;
}
function makeTukTuk() {
  const g = new THREE.Group();
  const yel = lam('#f0b429'), blue = lam('#1f5fa8'), dark = lam('#25272b'), glass = bas('#a9d3f5');
  g.add(mesh(3.2, 0.55, 1.5, blue, -0.3, 0.75, 0));                 // lower body
  g.add(mesh(1.0, 0.7, 1.1, yel, 1.55, 0.85, 0));                   // nose
  g.add(mesh(0.7, 0.3, 1.2, yel, 1.95, 0.6, 0));                    // front fender
  for (const sx of [0.55, -1.5]) for (const sz of [-0.68, 0.68]) g.add(mesh(0.12, 1.3, 0.12, dark, sx, 1.7, sz));   // pillars
  g.add(mesh(2.6, 0.14, 1.7, yel, -0.45, 2.4, 0));                  // roof
  g.add(mesh(2.2, 0.1, 1.5, yel, -0.45, 2.52, 0));                  // roof top
  g.add(mesh(0.08, 0.9, 1.3, glass, 0.6, 1.75, 0));                 // windshield
  g.add(mesh(0.9, 0.5, 1.3, dark, -1.05, 1.15, 0));                 // rear seat
  g.add(mesh(0.08, 0.5, 1.2, glass, -1.75, 1.85, 0));               // rear window
  g.add(mesh(0.8, 0.8, 0.28, dark, 1.9, 0.4, 0));                   // wheels
  g.add(mesh(0.8, 0.8, 0.3, dark, -1.1, 0.4, 0.85)); g.add(mesh(0.8, 0.8, 0.3, dark, -1.1, 0.4, -0.85));
  g.add(mesh(0.08, 0.28, 0.35, bas('#fff2b8'), 2.3, 1.0, 0));       // headlight
  g.add(mesh(0.06, 0.2, 0.3, bas('#ff2a2a'), -1.85, 0.9, 0.55)); g.add(mesh(0.06, 0.2, 0.3, bas('#ff2a2a'), -1.85, 0.9, -0.55));
  bagM = mesh(0.8, 0.6, 0.8, lam('#b83a2e'), -1.0, 1.55, 0); g.add(bagM);
  return g;
}
function labelSprite(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96; const g = c.getContext('2d');
  g.fillStyle = 'rgba(20,17,15,.88)'; g.fillRect(0, 8, 512, 80);
  g.font = '900 44px ' + FONT; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = color; g.fillText(text, 256, 50, 490);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(20, 3.75, 1); s.renderOrder = 10; return s;
}
function softTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, 'rgba(210,210,210,.9)'); gr.addColorStop(1, 'rgba(210,210,210,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}

/* merged world geometry: textured buildings + plain details + additive light pools = 3 draw calls */
function newGeo(withUv) { return { pos: [], col: [], uv: withUv ? [] : null, idx: [] }; }
const geoT = newGeo(true), geoP = newGeo(false), geoL = { pos: [], uv: [], idx: [] };
let dr = 4242; const drnd = () => { dr = (Math.imul(dr, 1664525) + 1013904223) >>> 0; return dr / 4294967296; };
function pushQuad(g, p0, p1, p2, p3, uvs, color, shades) {
  const base = g.pos.length / 3, ps = [p0, p1, p2, p3];
  for (let k = 0; k < 4; k++) {
    const sh = Array.isArray(shades) ? shades[k] : shades;
    g.pos.push(ps[k][0], ps[k][1], ps[k][2]);
    if (g.uv) g.uv.push(uvs[k][0], uvs[k][1]);
    g.col.push(Math.min(1, color.r * sh), Math.min(1, color.g * sh), Math.min(1, color.b * sh));
  }
  g.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
}
function addBox(g, x0, z0, w, d, h, col, y0 = 0, ao = 1) {
  const x1 = x0 + w, z1 = z0 + d, y1 = y0 + h, c = col && col.isColor ? col : new THREE.Color(col), U = 16, V = 14;
  const sides = [
    [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], 0.75, w],
    [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0], 0.85, d],
    [[x1, y0, z1], [x0, y0, z1], [x0, y1, z1], [x1, y1, z1], 0.95, w],
    [[x0, y0, z1], [x0, y0, z0], [x0, y1, z0], [x0, y1, z1], 0.7, d]
  ];
  for (const s of sides) {
    const uL = s[5] / U, vH = h / V;
    pushQuad(g, s[0], s[1], s[2], s[3], [[0, 0], [uL, 0], [uL, vH], [0, vH]], c, [s[4] * ao, s[4] * ao, s[4], s[4]]);
  }
  const q = [.023, .773];   // plain-wall texel of the window texture
  pushQuad(g, [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], [q, q, q, q], c, 1.1);
}
function windowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');

function spawnNpcs() {
  for (const n of npcs) if (n.mesh && scene) scene.remove(n.mesh);
  npcs.length = 0;
  for (let k = 0; k < 34; k++) {
    const horiz = rnd() < .5, dir = rnd() < .5 ? 1 : -1, t = pick(NPC_TYPES);
    const line = Math.floor(rnd() * ((horiz ? ROWS : COLS) + 1)) * CELL;
    const pos = rnd() * (horiz ? W : H);
    const off = (horiz ? (dir === 1 ? 1 : -1) : (dir === 1 ? -1 : 1)) * ROAD / 4;
    const n = { horiz, dir, t, line, off, pos, sp: 80 + rnd() * 70, stop: 0, x: 0, y: 0, a: 0, mesh: null };
    syncNpc(n);
    if (Math.hypot(n.x - START.x, n.y - START.y) < 340) { n.pos += 900; syncNpc(n); }
    if (scene) { n.mesh = makeCar(t.len, t.wid, t.body, t.roof); scene.add(n.mesh); }
    npcs.push(n);
  }
}

/* ---------- Audio: engine, horn, siren, city hum, oriental music ---------- */
const AU = { ac: null, master: null, music: true, sound: true, voice: true, warnedVoice: false, step: 0, next: 0, lastHorn: -9999, lastCrash: -9999 };
let noiseBuf = null;
function initAudio() {
  if (AU.ac) { try { AU.ac.resume(); } catch (e) {} return; }
  try {
    const ac = AU.ac = new (window.AudioContext || window.webkitAudioContext)();
    AU.master = ac.createGain(); AU.master.gain.value = 1; AU.master.connect(ac.destination);
    AU.musicG = ac.createGain(); AU.musicG.gain.value = 0.6; AU.musicG.connect(AU.master);
    const n = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    // engine
    AU.eOsc = ac.createOscillator(); AU.eOsc.type = 'sawtooth'; AU.eOsc.frequency.value = 40;
    const ef = ac.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 420;
    AU.eGain = ac.createGain(); AU.eGain.gain.value = 0;
    AU.eOsc.connect(ef); ef.connect(AU.eGain); AU.eGain.connect(AU.master); AU.eOsc.start();
    AU.lfo = ac.createOscillator(); AU.lfo.frequency.value = 18; AU.lfoG = ac.createGain(); AU.lfoG.gain.value = 0;
    AU.lfo.connect(AU.lfoG); AU.lfoG.connect(AU.eGain.gain); AU.lfo.start();
    // city hum
    const hum = ac.createBufferSource(); hum.buffer = noiseBuf; hum.loop = true;
    const hf = ac.createBiquadFilter(); hf.type = 'bandpass'; hf.frequency.value = 320; hf.Q.value = 0.6;
    const hg = ac.createGain(); hg.gain.value = 0.02; hum.connect(hf); hf.connect(hg); hg.connect(AU.master); hum.start();
    // siren
    AU.sirO = ac.createOscillator(); AU.sirO.type = 'sawtooth'; AU.sirO.frequency.value = 800;
    AU.sirL = ac.createOscillator(); AU.sirL.frequency.value = 1.3; const sl = ac.createGain(); sl.gain.value = 260;
    AU.sirL.connect(sl); sl.connect(AU.sirO.frequency);
    const sf = ac.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 2200;
    AU.sirG = ac.createGain(); AU.sirG.gain.value = 0;
    AU.sirO.connect(sf); sf.connect(AU.sirG); AU.sirG.connect(AU.master); AU.sirO.start(); AU.sirL.start();
    AU.next = ac.currentTime + 0.2;

  try { const vs = window.speechSynthesis.getVoices(); return vs.find(v => /^ar[-_]EG/i.test(v.lang)) || vs.find(v => /^ar/i.test(v.lang)) || null; } catch (e) { return null; }

/* ---------- Physics (identical to the 2D version) ---------- */
function collideRect(e, r) {
  const cx = clamp(e.x, r.x, r.x + r.w), cy = clamp(e.y, r.y, r.y + r.h);
  const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
  if (d2 >= e.rad * e.rad) return false;
  if (d2 === 0) {
    const l = e.x - r.x, rt = r.x + r.w - e.x, t = e.y - r.y, b = r.y + r.h - e.y, m = Math.min(l, rt, t, b);
    if (m === l) e.x = r.x - e.rad; else if (m === rt) e.x = r.x + r.w + e.rad; else if (m === t) e.y = r.y - e.rad; else e.y = r.y + r.h + e.rad;
  } else { const d = Math.sqrt(d2), push = e.rad - d; e.x += dx / d * push; e.y += dy / d * push; }
  return true;
}

function update(dt) {
  if (G.state !== 'play') return;
  G.t -= dt;
  if (G.t <= 0) { fail('الفجر طلّع', 'الوقت خلص والشنطة ما وصلتش. المعلم حمودة مش هيسامح.'); return; }

  const gas = keys.up || touch.up, brake = keys.down || touch.down;
  const steer = ((keys.right || touch.right) ? 1 : 0) - ((keys.left || touch.left) ? 1 : 0);
  if (gas) P.v += 230 * dt;
  if (brake) P.v -= (P.v > 0 ? 430 : 140) * dt;
  if (!gas && !brake) { const f = Math.min(Math.abs(P.v), 120 * dt); P.v -= Math.sign(P.v) * f; }
  P.v = clamp(P.v, -70, P.maxV);
  const turn = 2.6 * (1 - 0.3 * Math.abs(P.v) / 250) * clamp(P.v / 110, -1, 1);
  P.a += steer * turn * dt;
  P.x += Math.cos(P.a) * P.v * dt; P.y += Math.sin(P.a) * P.v * dt;

  const ci = Math.floor(P.x / CELL), cj = Math.floor(P.y / CELL);
  let hit = false;
  for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) {
    if (i < 0 || j < 0 || i >= COLS || j >= ROWS) continue;
    const b = grid[i][j]; if (b.plaza) continue;
    if (collideRect(P, b.solid)) hit = true;
  }
  P.x = clamp(P.x, 50, W - 50); P.y = clamp(P.y, 50, H - 50);
  if (hit) { if (Math.abs(P.v) > 60) { G.shake = Math.min(.6, G.shake + .25); crashSound(); } P.v *= 0.72; }

  for (const n of npcs) {
    if (n.stop > 0) n.stop -= dt;
    else {
      n.pos += n.dir * n.sp * dt; const L = n.horiz ? W : H;
      if (n.pos > L + 60) n.pos = -60; if (n.pos < -60) n.pos = L + 60;
      syncNpc(n);
    }
    const dx = P.x - n.x, dy = P.y - n.y, min = P.rad + n.t.len * 0.42;
    if (Math.abs(dx) < min + 10 && Math.abs(dy) < min + 10) {
      const d = Math.hypot(dx, dy);
      if (d < min && d > 0) {
        P.x += dx / d * (min - d); P.y += dy / d * (min - d);
        if (Math.abs(P.v) > 50) { P.v *= 0.4; G.shake = Math.min(.6, G.shake + .3); crashSound(); }
        n.stop = 0.8; hornSound(false);
      }
    }
  }

  if (Math.hypot(P.x - trailLast.x, P.y - trailLast.y) >= 24) {
    G.trail.push({ x: P.x, y: P.y }); trailLast = { x: P.x, y: P.y };
    if (G.trail.length > 700) { G.trail.splice(0, 250); if (G.cop) G.cop.i = Math.max(0, G.cop.i - 250); }
  }

  smokeT -= dt;
  if (P.level < 2 && smokeT <= 0) { smokeT = P.level === 0 ? .12 : .3; smoke.push({ x: P.x - Math.cos(P.a) * 20, y: P.y - Math.sin(P.a) * 20, life: 1 }); if (smoke.length > 16) smoke.shift(); }
  for (let k = smoke.length - 1; k >= 0; k--) { smoke[k].life -= dt * 1.2; if (smoke[k].life <= 0) smoke.splice(k, 1); }

  const z = zoneOfX(P.x);
  if (z !== G.zone) { if (G.zone !== -1) toast('دخلت ' + ZONES[z].name, 1800); G.zone = z; }

  const tg = currentTarget();
  if (tg && Math.hypot(tg.x - P.x, tg.y - P.y) < 78) {
    P.v = 0;
    if (G.stage === 0) workshopScene(); else if (G.stage === 1) cafeScene(); else dropScene();
    return;
  }
  if (G.stage === 2 && !G.checkpointDone && P.x > CHECKPOINT_X) { checkpointScene(); return; }

  const c = G.cop;
  if (c) {
    const d = Math.hypot(P.x - c.x, P.y - c.y);
    if (c.delay > 0) c.delay -= dt;
    else {
      let tx = P.x, ty = P.y;
      if (c.i < G.trail.length) { tx = G.trail[c.i].x; ty = G.trail[c.i].y; if (Math.hypot(tx - c.x, ty - c.y) < 34) c.i++; }
      c.a += clamp(angDiff(Math.atan2(ty - c.y, tx - c.x), c.a), -6 * dt, 6 * dt);
      c.x += Math.cos(c.a) * 205 * dt; c.y += Math.sin(c.a) * 205 * dt;
      if (d < 56) { c.catchT += dt; if (c.catchT > 1.1) { fail('اتمسكت!', 'البوليس لحقك والشنطة اتصادرت. المعلم حمودة هيعرف.'); return; } }
      else c.catchT = Math.max(0, c.catchT - dt);
    }
    if (d > 700) { c.lostT += dt; if (c.lostT > 2) { G.cop = null; G.heat = false; toast('فلّتّ من البوليس!', 2400); } } else c.lostT = 0;
  }

  hudT -= dt; if (hudT <= 0) { hudT = 0.2; updateHud(); }
}

/* ---------- 3D rendering ---------- */
const skyStops = typeof THREE !== 'undefined' ? [new THREE.Color('#0b1030'), new THREE.Color('#2b2350'), new THREE.Color('#f0a070')] : [];
const skyTmp = typeof THREE !== 'undefined' ? new THREE.Color() : null;
function render3D(dt) {
  if (!renderer) return;
  // vehicles
  playerG.position.set(P.x * SC, 0, P.y * SC); playerG.rotation.y = -P.a; bagM.visible = G.hasBag;
  for (const n of npcs) {
    const near = Math.abs(n.x - P.x) < 1300 && Math.abs(n.y - P.y) < 1300;
    n.mesh.visible = near; if (near) { n.mesh.position.set(n.x * SC, 0, n.y * SC); n.mesh.rotation.y = -n.a; }
  }
  const flash = Math.floor(now / 200) % 2 === 0;
  if (G.cop) { copG.visible = true; copG.position.set(G.cop.x * SC, 0, G.cop.y * SC); copG.rotation.y = -G.cop.a;
    copLights[0].color.set(flash ? '#ff3b30' : '#2d6cff'); copLights[1].color.set(flash ? '#2d6cff' : '#ff3b30'); } else copG.visible = false;
  if (G.barrier) { barrierG.visible = true; barrierG.position.set(G.barrier.x * SC, 0, G.barrier.y * SC); barrierG.rotation.y = -G.barrier.a;
    barrierLights[0].color.set(flash ? '#ff3b30' : '#2d6cff'); barrierLights[1].color.set(flash ? '#2d6cff' : '#ff3b30'); } else barrierG.visible = false;

  // objective marker
  const tg = currentTarget();
  markerGs.forEach((m, k) => { m.visible = tg === TARGETS[k]; if (m.visible) { const p = 1 + 0.06 * Math.sin(now * 0.005); m.userData.ring.scale.set(p, p, p); } });

  // smoke
  smokeSprites.forEach((s, k) => {
    const e = smoke[k]; if (!e) { s.visible = false; return; }
    s.visible = true; s.position.set(e.x * SC, 0.9 + (1 - e.life) * 2.5, e.y * SC);
    const sz = 0.5 + (1 - e.life) * 1.8; s.scale.set(sz, sz, 1); s.material.opacity = e.life * 0.35;
  });

  // chase camera
  const first = !camState.init;
  if (first) { camState.yaw = P.a; camState.init = true; }
  camState.yaw += angDiff(P.a, camState.yaw) * Math.min(1, dt * 3.5);
  const fx = Math.cos(camState.yaw), fz = Math.sin(camState.yaw), sp = Math.abs(P.v);
  const dist = 9.5 + sp * 0.012, hgt = 6.2 + sp * 0.004, px = P.x * SC, pz = P.y * SC;
  const tx = px - fx * dist, tz = pz - fz * dist;
  if (first) camera.position.set(tx, hgt, tz);
  else { const k = Math.min(1, dt * 7); camera.position.x += (tx - camera.position.x) * k; camera.position.z += (tz - camera.position.z) * k; camera.position.y += (hgt - camera.position.y) * k; }
  const sh = G.shake > 0 ? G.shake : 0; G.shake = Math.max(0, G.shake - dt * 1.5);
  camera.position.x += (Math.random() - .5) * 0.6 * sh; camera.position.y += (Math.random() - .5) * 0.4 * sh;
  camera.lookAt(px + fx * 10, 0.6, pz + fz * 10);
  camera.fov = baseFov + (sp / 250) * 8; camera.updateProjectionMatrix();

  // sky: night → dawn as the timer runs out
  const dawn = clamp(1 - G.t / TOTAL_TIME, 0, 1);
  skyT -= dt;
  if (skyT <= 0) {
    skyT = 0.5;
    const tops = ['#04061a', '#242a63', '#4b5aa3'], mids = ['#0c1540', '#5a3b78', '#e58a72'], hors = ['#22386a', '#c56b7a', '#ffc27a'];
    const f = dawn < 0.55 ? dawn / 0.55 : (dawn - 0.55) / 0.45, i0 = dawn < 0.55 ? 0 : 1, i1 = i0 + 1;
    const mix = a => skyTmp.set(a[i0]).lerp(new THREE.Color(a[i1]), f).getStyle();
    const cx = skyCanvas.getContext('2d'), gr = cx.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, mix(tops)); gr.addColorStop(0.42, mix(mids)); gr.addColorStop(0.5, mix(hors)); gr.addColorStop(0.62, mix(hors)); gr.addColorStop(1, mix(hors));
    cx.fillStyle = gr; cx.fillRect(0, 0, 2, 256); skyTex.needsUpdate = true;
    skyTmp.set(hors[i0]).lerp(new THREE.Color(hors[i1]), f); scene.fog.color.copy(skyTmp);
  }
  hemi.intensity = 0.8 + dawn * 0.5;
  stars.position.copy(camera.position); stars.material.opacity = clamp(1 - dawn * 1.7, 0, 1);
  moon.position.set(camera.position.x - 110, camera.position.y + 130, camera.position.z + 300); moon.material.opacity = clamp(1 - dawn * 1.4, 0, 1);
  sunS.position.set(camera.position.x + 150, camera.position.y + 24 + dawn * 40, camera.position.z + 320); sunS.material.opacity = clamp((dawn - 0.35) * 1.6, 0, 1);

  // HUD compass arrow + minimap
  if (tg && G.state === 'play') $('#arrowi').style.transform = 'rotate(' + angDiff(Math.atan2(tg.y - P.y, tg.x - P.x), camState.yaw) + 'rad)';
  miniT -= dt; if (miniT <= 0) { miniT = 0.12; drawMini(); }
  renderer.render(scene, camera);
}

const mBase = document.createElement('canvas'); mBase.width = mini.width; mBase.height = mini.height;
(() => {
  const g = mBase.getContext('2d'), sx = mBase.width / W, sy = mBase.height / H;
  g.fillStyle = '#2a2826'; g.fillRect(0, 0, mBase.width, mBase.height);
  for (const b of blocks) { g.fillStyle = b.plaza ? ZONES[b.z].plaza : ZONES[b.z].mini; g.fillRect(b.x * sx, b.y * sy, b.w * sx, b.h * sy); }
})();
function drawMini() {
  const sx = mini.width / W, sy = mini.height / H;
  mctx.drawImage(mBase, 0, 0);
  const tg = currentTarget();
  if (tg) { mctx.fillStyle = '#ff5a3c'; mctx.beginPath(); mctx.arc(tg.x * sx, tg.y * sy, 6, 0, TAU); mctx.fill(); }
  if (G.cop) { mctx.fillStyle = '#2d6cff'; mctx.beginPath(); mctx.arc(G.cop.x * sx, G.cop.y * sy, 5, 0, TAU); mctx.fill(); }
  mctx.fillStyle = '#ffe14d'; mctx.strokeStyle = '#000'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.arc(P.x * sx, P.y * sy, 5, 0, TAU); mctx.fill(); mctx.stroke();
}

/* ---------- Sizing, input, loop ---------- */
function resize() {
  if (!renderer) return;
  const cw = canvas.clientWidth || window.innerWidth, ch = canvas.clientHeight || window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));   // capped to keep phones cool
  renderer.setSize(cw, ch, false);
  camera.aspect = cw / ch; baseFov = cw / ch < 1 ? 74 : 62; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (k) { keys[k] = true; e.preventDefault(); }
  if (e.code === 'KeyH') hornSound(true);
  if ((e.code === 'Space' || e.code === 'Enter') && advance) { const f = advance; advance = null; f(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
function bindBtn(id, k) {
  const el = $(id);
  const on = e => { e.preventDefault(); touch[k] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { e.preventDefault(); touch[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('#bL', 'left'); bindBtn('#bR', 'right'); bindBtn('#bG', 'up'); bindBtn('#bB', 'down');
$('#bH').addEventListener('pointerdown', e => { e.preventDefault(); hornSound(true); });
function bindToggle(id, key, onChange) {
  const el = $(id); el.addEventListener('click', () => { AU[key] = !AU[key]; el.classList.toggle('off', !AU[key]); if (onChange) onChange(); });
}
bindToggle('#tSound', 'sound', applyMute); bindToggle('#tMusic', 'music'); bindToggle('#tVoice', 'voice', stopSpeech);
document.addEventListener('visibilitychange', () => { for (const k in touch) touch[k] = false; for (const k in keys) keys[k] = false; stopSpeech(); });

if (!HAS3D) {
  $('#start').classList.add('hidden');
  const n = $('#nogl'); n.classList.remove('hidden');
  n.textContent = 'الـ 3D مش شغال على جهازك أو المتصفح ده. جرّب متصفح تاني، أو استخدم النسخة الخفيفة 2D (classic-2d.html).';
} else if ('speechSynthesis' in window) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

$('#start').addEventListener('click', () => { initAudio(); newGame(); });
$('#again').addEventListener('click', () => { initAudio(); newGame(); });

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden || !renderer) { last = t; return; }
  const el = t - last;
  if (el < 1000 / 40 - 2) return;          // ~30–40 fps cap: much cooler than 60/120
  last = t; now = t;
  const dt = Math.min(0.05, el / 1000);
  update(dt); render3D(dt); updateAudio();
}
requestAnimationFrame(frame);

})();
</script>
</body>
